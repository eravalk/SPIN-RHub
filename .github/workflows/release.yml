name: Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare Android tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.38.0/ecj-3.38.0.jar -o "$RUNNER_TEMP/ecj.jar"
      - name: Build signed APK
        env:
          SIGNING_STORE: ${{ secrets.SPIN_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SPIN_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          umask 077
          test -n "$SIGNING_STORE" && test -n "$SIGNING_PASSWORD"
          mkdir -p signing
          trap 'rm -rf signing' EXIT
          printf '%s' "$SIGNING_STORE" | base64 -d > signing/spin-next.keystore
          printf '%s' "$SIGNING_PASSWORD" > signing/password.txt
          SPIN_SDK="$ANDROID_HOME" SPIN_ECJ_JAR="$RUNNER_TEMP/ecj.jar" bash build-local.sh
          version="${GITHUB_REF_NAME#v}"
          expected="SPIN-RHub-$version.apk"
          test -f "$expected"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$expected" | grep -F "versionName='$version'"
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "SPIN-RHub-${GITHUB_REF_NAME#v}.apk" --verify-tag --generate-notes
